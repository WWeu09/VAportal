  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        const slides = document.querySelectorAll('.slide');
        const total = slides.length;
        let current = 0;

        function showSlide(index) {
            slides[current].classList.remove('active');
            current = Math.max(0, Math.min(index, total - 1));
            slides[current].classList.add('active');
            document.getElementById('slide-counter').textContent = `${current + 1} / ${total}`;
        }

        showSlide(0);

        document.getElementById('prev-btn').addEventListener('click', () => showSlide(current - 1));
        document.getElementById('next-btn').addEventListener('click', () => showSlide(current + 1));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') showSlide(current + 1);
            if (e.key === 'ArrowLeft') showSlide(current - 1);
        });

        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // Quiz button - placeholder action
        document.querySelector('[data-template-id="s8-quiz-btn"]').addEventListener('click', (e) => {
            e.preventDefault();
            // No external navigation possible; show inline message
            e.target.textContent = '🎉 Quiz komt eraan!';
            e.target.disabled = true;
        });
    </script>
